name: Release

# Tag a version to publish:  git tag v0.1.0 && git push --tags
# Or run it by hand from the Actions tab to get an unsigned build for testing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      sign:
        description: "Sign and notarize (needs the secrets to be set)"
        type: boolean
        default: true

# The default token is read-only, so creating a release failed with "Resource not
# accessible by integration" after an otherwise clean build. Only the release step
# needs more than read.
permissions:
  contents: write

jobs:
  macos:
    # macOS runner is not optional: the sidecar is Swift against AppKit and
    # CoreGraphics, codesign only exists here, and notarization talks to Apple
    # through a tool that ships with Xcode.
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        # The scheduler is the part that cannot be checked by looking at the app,
        # so a release never goes out on a red suite.
        run: npm test

      - name: Build sidecar and icon
        run: |
          npm run build:native:universal
          npm run build:icon
          lipo -archs native/VellumInput/dist/vellum-input

      - name: Build renderer
        run: npm run build:renderer

      - name: Package
        id: package
        env:
          # Passed through unconditionally. These were behind a
          # `inputs.sign != false && secrets.X || ''` ternary, which looks right
          # and is not: on a tag push `inputs.sign` is null, GitHub's loose
          # equality treats null and false as equal, so the condition was false
          # and every tagged release built unsigned with the secrets sitting
          # right there.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Only an explicit dispatch with sign=false opts out.
          SKIP_SIGNING: ${{ github.event_name == 'workflow_dispatch' && inputs.sign == false }}
          # Never let electron-builder create a release on its own; the upload
          # step below is the only thing that publishes.
          GH_TOKEN: ""
        run: |
          if [ -n "$CSC_LINK" ] && [ "$SKIP_SIGNING" != "true" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            # Sign only. electron-builder's own notarize step submits the .app and
            # then builds the DMG around it, so the DMG is never itself submitted
            # and nothing ends up stapled — it reported "notarization successful"
            # while producing an artifact with no ticket on it. The next step
            # notarizes the finished DMG instead, which is the flow that works
            # by hand.
            npx electron-builder --mac --publish never --config.mac.notarize=false
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing certificate — building unsigned"
            npx electron-builder --mac --publish never \
              --config.mac.identity=null --config.mac.notarize=false
          fi

      - name: Notarize and staple
        if: steps.package.outputs.signed == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG=$(ls dist/*.dmg | head -1)
          echo "submitting $(basename "$DMG")"

          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          # Stapling is the part that matters offline. Notarization alone means
          # Apple approved the build; a Mac with no internet cannot check that,
          # so without the stapled ticket it still shows a Gatekeeper warning.
          xcrun stapler staple "$DMG"

      - name: Verify the bundle
        run: |
          APP="dist/mac-arm64/Vellum Studio.app"
          [ -d "$APP" ] || APP="dist/mac/Vellum Studio.app"

          echo "── sidecar architectures ──"
          lipo -archs "$APP/Contents/Resources/vellum-input"

          # Read from the package step rather than re-deriving the condition.
          # Package and Verify each worked it out separately and disagreed: the
          # build went unsigned while verification demanded a signature, and
          # failed on a bundle that was never signed in the first place.
          if [ "${{ steps.package.outputs.signed }}" = "true" ]; then
            echo "── signature ──"
            codesign --verify --deep --strict --verbose=2 "$APP"
            # The sidecar is an extraResource, which electron-builder does not
            # sign on its own — build/after-sign.cjs handles it. Check it stuck,
            # because an unsigned nested binary fails notarization and silently
            # detaches the Accessibility grant from the app.
            codesign --verify --verbose=2 "$APP/Contents/Resources/vellum-input"
            # Check the DMG, not the loose .app.
            #
            # electron-builder notarizes and staples the DMG, so the app left in
            # dist/mac-arm64 carries no ticket and spctl correctly calls it
            # unnotarized — a wrong check failing a build that was in fact fine.
            # The DMG is also what people actually download, so its stapled
            # ticket is the thing worth asserting: it is what lets the app open
            # on a machine with no internet.
            # `stapler validate` is the whole check. spctl was also run here with
            # `-t open --context context:primary-signature`, which assesses a
            # quarantined document rather than a freshly built disk image and so
            # reported "no usable signature" on an artifact that was correctly
            # signed, notarized and stapled — failing three good builds in a row
            # on the strength of a verification command that did not apply.
            echo "── notarization ──"
            DMG=$(ls dist/*.dmg | head -1)
            xcrun stapler validate "$DMG"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: vellum-studio-macos
          path: dist/*.dmg
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          draft: true
          generate_release_notes: true
